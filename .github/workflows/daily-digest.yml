name: Daily Digest

on:
  schedule:
    # Runs every day at 06:00 UTC. Adjust as needed.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit README.md back to the repo

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch daily digest
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python fetch_daily.py

      - name: Commit and push if README.md changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update daily digest $(date -u +'%Y-%m-%d')"
          git push
